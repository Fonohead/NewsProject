<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333333;
        background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px;
        border-radius: 8px; border: 1px solid #e0e0e0; text-align: center; }
        h2 { color: #3498db; margin-bottom: 20px; }
        .welcome-box { background-color: #ecf0f1; padding: 15px; border-radius: 4px; margin: 20px 0; font-size: 16px; }
        .btn { display: inline-block; padding: 12px 24px; color: #ffffff !important;
        background-color: #3498db; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 11px; color: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Добро пожаловать на наш портал!</h2>
        <p>Здравствуйте, <strong>{{ username }}</strong>!</p>

        <div class="welcome-box">
            Вы успешно зарегистрировались на Новостном Портале.
        </div>

        <p>Теперь вы можете подписываться на любимые категории новостей и получать еженедельные дайджесты.</p>

        <p><a href="{{ site_url }}/news/" class="btn">Начать чтение новостей</a></p>

        </div>
    </div>
</body>
</html>
